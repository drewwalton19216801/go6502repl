# memory.cfg - Simple linker configuration for hello.bin

MEMORY {
    # ... (MEMORY definition remains the same) ...
    ZP:     start = $0000, size = $0100, type = rw;
    DATA:   start = $0200, size = $0E00, type = rw, file = %O, fill=yes;
    CODE:   start = $C000, size = $4000, type = ro, file = %O, fill=yes;
}

SEGMENTS {
    # ... (SEGMENTS definition remains the same) ...
    ZEROPAGE: load = ZP,    type = zp;
    DATA:     load = DATA,  type = rw,  define = yes;
    CODE:     load = CODE,  type = ro,  define = yes;
    STARTUP:  load = CODE,  type = ro,  optional = yes;
    ONCE:     load = CODE,  type = ro,  optional = yes;
    RODATA:   load = CODE,  type = ro,  optional = yes;
    INIT:     load = CODE,  type = ro,  optional = yes;
    BSS:      load = DATA,  type = bss, optional = yes, define = yes;
}

FEATURES {
    # ... (FEATURES definition remains the same) ...
    CONDES: segment = INIT,
            type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__;
    CONDES: segment = RODATA,
            type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__;
    CONDES: segment = RODATA,
            type = interruptor,
            label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__;
}

FILES {
    %O: format = bin; # Output format is raw binary
}