# memory.cfg - Simple linker configuration for hello.bin

MEMORY {
    # ... (MEMORY definition remains the same) ...
    RAM:    start = $0200, size = $0E00, type = rw;
    ROM:    start = $0000, size = $10000, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    # Segments that go into the ROM file must load into the ROM memory area.
    # Use 'start' to specify their address *within* the ROM area.
    CODE:     load = ROM,   type = ro,  define = yes, start = $C000; # Code starts at $C000
    DATA:     load = ROM,   type = ro,  define = yes;                # Place DATA after CODE (linker decides exact spot within C000-FFFA range)
    STARTUP:  load = ROM,   type = ro,  optional = yes, start = $C000; # Often placed with CODE
    ONCE:     load = ROM,   type = ro,  optional = yes;
    RODATA:   load = ROM,   type = ro,  optional = yes;
    INIT:     load = ROM,   type = ro,  optional = yes;
    BSS:      load = RAM,   type = bss, optional = yes, define = yes; # BSS lives in RAM, not ROM file
    VECTORS:  load = ROM,   type = ro,  start = $FFFA, optional = yes; # Vectors fixed at $FFFA
}

FEATURES {
    # ... (FEATURES definition remains the same) ...
    CONDES: segment = INIT,
            type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__;
    CONDES: segment = RODATA,
            type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__;
    CONDES: segment = RODATA,
            type = interruptor,
            label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__;
}

FILES {
    %O: format = bin; # Output format is raw binary
}